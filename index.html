<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Login</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: radial-gradient(circle at top, #1a0000, #000000);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .login-box {
      background: rgba(20, 20, 20, 0.9);
      padding: 35px;
      border-radius: 15px;
      width: 340px;
      text-align: center;
      box-shadow: 0 0 25px rgba(255, 0, 0, 0.4);
      border: 1px solid rgba(255, 0, 0, 0.3);
    }

    h2 {
      margin-bottom: 20px;
      color: #ff2e2e;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 12px 0;
      border-radius: 8px;
      background: #111;
      color: white;
      border: 1px solid #333;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      border-radius: 8px;
      background: #ff0000;
      color: white;
      cursor: pointer;
    }

    .admin-btn {
      background: transparent;
      color: #00d4ff;
      margin-top: 15px;
      border: none;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div class="login-box">
  <h2>Entrar</h2>

  <input type="text" id="login" placeholder="Email ou Telefone">
  <input type="password" id="senha" placeholder="Senha">

  <button onclick="entrar()">Entrar</button>

  <button class="admin-btn" onclick="contactarAdmin()">
    Contactar Admin
  </button>
</div>

<script>

const usuarios = [
  { login: "wadiariovaldo24@gmail.com", senha: "!!Joice2424", role: "admin" },
  { login: "Inock", senha: "1234", role: "user" }
];

function entrar() {
  const login = document.getElementById("login").value.trim();
  const senha = document.getElementById("senha").value.trim();

  const user = usuarios.find(u => 
    u.login === login && u.senha === senha
  );

  if (!user) {
    alert("Login ou senha incorretos");
    return;
  }

  // salva sessão
  localStorage.setItem("usuarioLogado", JSON.stringify(user));

  console.log("LOGADO:", user); // DEBUG

  // REDIRECIONAMENTO SEGURO
  if (user.role.toLowerCase() === "admin") {
    window.location.href = "./admin.html";
  } else {
    window.location.href = "./user.html";
  }
}

function contactarAdmin() {
  const numero = "953200373";
  const mensagem = "Olá, quero me cadastrar na plataforma";
  const url = `https://wa.me/${numero}?text=${encodeURIComponent(mensagem)}`;
  window.open(url, "_blank");
}

</script>

</body>
</html>
