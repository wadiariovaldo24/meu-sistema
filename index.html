<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Login</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: radial-gradient(circle at top, #1a0000, #000000);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .login-box {
      background: rgba(20, 20, 20, 0.9);
      padding: 35px;
      border-radius: 15px;
      width: 340px;
      text-align: center;
      box-shadow: 0 0 25px rgba(255, 0, 0, 0.4);
      border: 1px solid rgba(255, 0, 0, 0.3);
      animation: fadeIn 1s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h2 {
      margin-bottom: 20px;
      color: #ff2e2e;
      letter-spacing: 1px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 12px 0;
      border: none;
      border-radius: 8px;
      outline: none;
      font-size: 14px;
      background: #111;
      color: white;
      border: 1px solid #333;
      transition: 0.3s;
    }

    input:focus {
      border: 1px solid #ff2e2e;
      box-shadow: 0 0 8px rgba(255, 0, 0, 0.6);
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(45deg, #ff0000, #ff4d4d);
      color: white;
      font-size: 15px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 15px rgba(255, 0, 0, 0.6);
    }

    .admin-btn {
      background: transparent;
      color: #00d4ff;
      margin-top: 15px;
      border: none;
      cursor: pointer;
      font-size: 13px;
    }

    .admin-btn:hover {
      text-decoration: underline;
      color: #38bdf8;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 15px;
      color: #ff2e2e;
      text-shadow: 0 0 10px rgba(255,0,0,0.7);
    }

  </style>
</head>

<body>

<div class="login-box">

  <div class="logo">AVIATOR SIGNAL</div>

  <h2>Entrar</h2>

  <input type="text" id="login" placeholder="Email ou Telefone">

  <input type="password" id="senha" placeholder="Senha">

  <button onclick="entrar()">Entrar</button>

  <button class="admin-btn" onclick="contactarAdmin()">
    Contactar Admin
  </button>
</div>

<script>

  const usuarios = [
    { login: "wadiariovaldo24@gmail.com", senha: "!!Joice2424", role: "Admin" },
    { login: "Inock", senha: "1234", role: "user" }
  ];

  function entrar() {
    const login = document.getElementById("login").value;
    const senha = document.getElementById("senha").value;

    const user = usuarios.find(u => u.login === login);

    if (!user) {
      alert("Usuário não encontrado");
      return;
    }

    if (user.senha !== senha) {
      alert("Senha incorreta");
      return;
    }

    if (user.role === "Admin") {
  window.location.href = "admin.html";
} else {
  window.location.href = "user.html";
}
  }

  function contactarAdmin() {
    const numero = "953200373"; // 🔥 teu número
    const mensagem = "Olá, quero me cadastrar na plataforma";

    const url = `https://wa.me/${numero}?text=${encodeURIComponent(mensagem)}`;

    window.open(url, "_blank");
  }

</script>

</body>
</html>
